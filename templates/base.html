<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8FC">
  <meta name="description" content="You talk. Ramble keeps a readable version of what you said.">
  <title>{% block title %}Ramble{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/ramble.css' %}">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="site">
    <nav class="navbar glass">
      <a class="wordmark" href="{% if user.is_authenticated %}{% url 'notes:list' %}{% else %}{% url 'notes:home' %}{% endif %}">Ramble</a>
      <div class="nav-links">
        {% if user.is_authenticated %}
          <a class="nav-link{% if request.resolver_match.url_name == 'list' %} is-current{% endif %}" href="{% url 'notes:list' %}">Roll</a>
          <a class="nav-link{% if request.resolver_match.url_name == 'settings' %} is-current{% endif %}" href="{% url 'settings' %}">Settings</a>
        {% else %}
          <a class="nav-link{% if request.resolver_match.url_name == 'login' %} is-current{% endif %}" href="{% url 'login' %}">Sign in</a>
          <a class="btn btn-primary" href="{% url 'register' %}">Get started</a>
        {% endif %}
      </div>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <span class="wordmark">Ramble</span>
    </footer>
  </div>
</body>
</html>
