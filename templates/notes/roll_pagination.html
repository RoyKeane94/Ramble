{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="roll-pagination" aria-label="Pages">
  {% if page_obj.has_previous %}
    <a class="text-link" href="{% if library_page %}{% url 'notes:library' %}?{% else %}?album={{ album }}{% if query %}&amp;{% endif %}{% endif %}{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
  {% else %}
    <span class="roll-pagination-spacer" aria-hidden="true"></span>
  {% endif %}
  <span class="roll-pagination-status">{{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="text-link" href="{% if library_page %}{% url 'notes:library' %}?{% else %}?album={{ album }}{% if query %}&amp;{% endif %}{% endif %}{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
  {% else %}
    <span class="roll-pagination-spacer" aria-hidden="true"></span>
  {% endif %}
</nav>
{% endif %}
