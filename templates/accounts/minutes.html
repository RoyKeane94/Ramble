{% if minute_usage %}
<div class="settings-block panel">
  <p class="settings-label">Minutes</p>
  <p class="settings-email">{{ minute_usage.used_minutes_label }} of {{ minute_usage.cap_minutes }} minutes used</p>
  <div
    class="settings-meter"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="{{ minute_usage.cap_minutes }}"
    aria-valuenow="{{ minute_usage.used_minutes_label }}"
    aria-label="{{ minute_usage.used_minutes_label }} of {{ minute_usage.cap_minutes }} minutes used"
  >
    <span style="width: {{ minute_usage.used_percent }}%;"></span>
  </div>
  <p class="settings-hint">{{ minute_usage.remaining_copy }}</p>
</div>
{% endif %}
