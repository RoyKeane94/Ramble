{% extends "base.html" %}

{% block title %}Page not found — Ramble{% endblock %}

{% block content %}
<div class="shell shell-wide">
  <section class="hero error-page">
    <p class="page-kicker">Web · 404</p>
    <h1 class="hero-title">Not here.</h1>
    <p class="hero-lede">That page doesn’t exist, or you don’t have access to it.</p>
    <div class="hero-actions">
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'notes:list' %}">Back to Roll</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'notes:home' %}">Go home</a>
      {% endif %}
    </div>
  </section>
</div>
{% endblock %}
