{% extends "base.html" %}

{% block title %}Something went wrong — Ramble{% endblock %}

{% block content %}
<div class="shell shell-wide">
  <section class="hero error-page">
    <p class="page-kicker">Web · 500</p>
    <h1 class="hero-title">Something broke.</h1>
    <p class="hero-lede">We’ve logged the error. Try again in a moment.</p>
    <div class="hero-actions">
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'notes:list' %}">Back to Recents</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'notes:home' %}">Go home</a>
      {% endif %}
    </div>
  </section>
</div>
{% endblock %}
