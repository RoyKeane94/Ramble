<div class="app-share-sheet" data-app-share-sheet hidden>
  <button type="button" class="app-share-backdrop" data-app-share-close tabindex="-1" aria-label="Close"></button>
  <div class="app-share-stack" role="dialog" aria-modal="true" aria-labelledby="app-share-heading">
    <div class="app-share-card">
      <p id="app-share-heading" class="app-share-heading">Share take</p>
      <p class="app-share-preview" data-app-share-preview></p>
      <button type="button" class="app-share-row" data-app-share-copy>
        <span class="app-share-row-label">Copy</span>
      </button>
      <button type="button" class="app-share-row" data-app-share-native hidden>
        <span class="app-share-row-label">More…</span>
      </button>
    </div>
    <div class="app-share-card app-share-card--solo">
      <button type="button" class="app-share-row app-share-row--cancel" data-app-share-close>
        <span class="app-share-row-label">Cancel</span>
      </button>
    </div>
  </div>
</div>
