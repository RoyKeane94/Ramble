<div class="app-shutter" hidden>
  <div class="app-shutter-fade" aria-hidden="true"></div>
  <div class="app-shutter-pad">
    <button class="app-record-btn" type="button" data-app-record aria-label="Start recording">
      <span class="app-record-ring"></span>
      <span class="app-record-face"></span>
      <span class="app-record-stop" hidden></span>
    </button>
    <p class="app-shutter-hint" data-app-allowance></p>
  </div>
</div>

<div class="app-record-screen" hidden data-app-record-screen aria-hidden="true">
  <div class="app-record-timer">
    <p class="app-record-elapsed" data-app-elapsed>0:00</p>
    <p class="app-record-limit" data-app-limit>/ 5:00</p>
  </div>
</div>
